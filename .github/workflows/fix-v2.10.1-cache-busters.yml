name: Fix TrainLog Pro v2.10.1 cache busters

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-v2.10.1-cache-busters.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh asset version query strings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='?v=2.10.0'
          count=s.count(old)
          if count == 0:
              raise SystemExit('No v2.10.0 asset cache keys found')
          s=s.replace(old,'?v=2.10.1')
          p.write_text(s,encoding='utf-8')
          print(f'updated {count} asset cache keys')
          PY
          grep -q '<title>TrainLog Pro v2.10.1</title>' index.html
          grep -q 'js/app.js?v=2.10.1' index.html
          grep -q 'js/core/storage.js?v=2.10.1' index.html
          grep -q 'js/training/progression-view.js?v=2.10.1' index.html
          ! grep -q '?v=2.10.0' index.html
          node --check js/app.js
          node --check js/core/storage.js
          node --check js/training/progression.js
          node --check js/training/progression-view.js

      - name: Commit cache-key fix
        shell: bash
        run: |
          rm -f .github/workflows/fix-v2.10.1-cache-busters.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/fix-v2.10.1-cache-busters.yml
          git commit -m 'fix: refresh v2.10.1 asset cache keys'
          git push origin HEAD:main
