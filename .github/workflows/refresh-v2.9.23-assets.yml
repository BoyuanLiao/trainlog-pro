name: Refresh TrainLog Pro v2.9.23 Assets

on:
  push:
    paths:
      - '.github/workflows/refresh-v2.9.23-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh cache-busting asset URLs
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('?v=2.9.22','?v=2.9.23')
          p.write_text(s,encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh v2.9.23 asset cache keys"
          git push
