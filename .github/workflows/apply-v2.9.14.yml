name: Apply TrainLog Pro v2.9.14

on:
  push:
    paths:
      - '.github/workflows/apply-v2.9.14.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index for v2.9.14
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('TrainLog Pro v2.9.13', 'TrainLog Pro v2.9.14')
          s = s.replace('>v2.9.13<', '>v2.9.14<')
          if 'css/motion-gifs.css' not in s:
              s = s.replace('<link rel="stylesheet" href="css/app.css">', '<link rel="stylesheet" href="css/app.css">\n<link rel="stylesheet" href="css/motion-gifs.css">')
          if 'js/motion-gifs.js' not in s:
              s = s.replace('<script src="js/app.js"></script>', '<script src="js/app.js"></script>\n<script src="js/motion-gifs.js"></script>')
          p.write_text(s, encoding='utf-8')
      - name: Commit updated entry page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: enable v2.9.14 motion GIF demos"
          git push
