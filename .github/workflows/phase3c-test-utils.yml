name: Phase 3c - Core utils characterization tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase3c-test-utils.yml'
      - 'tests/core/utils-characterization.test.js'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run migration characterization tests
        run: node tests/core/migration-characterization.test.js
      - name: Run storage characterization tests
        run: node tests/core/storage-characterization.test.js
      - name: Run utils characterization tests
        run: node tests/core/utils-characterization.test.js
