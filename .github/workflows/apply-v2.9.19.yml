name: Apply TrainLog Pro v2.9.19

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v2.9.19.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch animation loading and cache busting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          idxp=Path('index.html')
          appp=Path('js/app.js')
          motp=Path('js/motion-gifs.js')
          idx=idxp.read_text(encoding='utf-8')
          app=appp.read_text(encoding='utf-8')
          mot=motp.read_text(encoding='utf-8')

          idx=idx.replace('TrainLog Pro v2.9.18','TrainLog Pro v2.9.19').replace('>v2.9.18<','>v2.9.19<')
          idx=idx.replace('<link rel="stylesheet" href="css/app.css">','<link rel="stylesheet" href="css/app.css?v=2.9.19">')
          idx=idx.replace('<link rel="stylesheet" href="css/motion-gifs.css">','<link rel="stylesheet" href="css/motion-gifs.css?v=2.9.19">')
          idx=idx.replace('<script src="js/app.js"></script>\n<script src="js/motion-gifs.js"></script>','<script src="js/motion-gifs.js?v=2.9.19"></script>\n<script src="js/app.js?v=2.9.19"></script>')

          old="${window.TrainLogMotion3DHtml?window.TrainLogMotion3DHtml(e.id,e.pattern,e.name):''}"
          new="${window.TrainLogMotion3DHtml?window.TrainLogMotion3DHtml(e.id,e.pattern,e.name):'<div class=\"warnbox\"><b>3D 動畫元件尚未載入</b><div class=\"small\">請重新整理頁面；若持續出現，代表動畫腳本載入失敗。</div></div>'}"
          if old not in app:
              raise SystemExit('3D helper insertion point not found')
          app=app.replace(old,new,1)

          mot=mot.replace('// TrainLog Pro v2.9.17 exercise 3D-style GIF demos','// TrainLog Pro v2.9.19 exercise 3D-style GIF demos')
          mot=mot.replace("'assets/motion3d/'+k+'.gif'","'assets/motion3d/'+k+'.gif?v=2.9.19'")

          idxp.write_text(idx,encoding='utf-8')
          appp.write_text(app,encoding='utf-8')
          motp.write_text(mot,encoding='utf-8')
          PY

          node --check js/app.js
          node --check js/motion-gifs.js
          grep -q 'TrainLog Pro v2.9.19' index.html
          grep -q 'motion-gifs.js?v=2.9.19' index.html
          grep -q 'app.js?v=2.9.19' index.html
          grep -q '3D 動畫元件尚未載入' js/app.js
          grep -q 'gif?v=2.9.19' js/motion-gifs.js

          rm -f .github/workflows/apply-v2.9.19.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html js/app.js js/motion-gifs.js .github/workflows/apply-v2.9.19.yml
          git commit -m 'fix: bust cached animation assets and load motion helper first'
          git push
