name: Apply TrainLog Pro v2.9.19

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v2.9.19.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch animation cache busting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('TrainLog Pro v2.9.18','TrainLog Pro v2.9.19').replace('>v2.9.18<','>v2.9.19<')
          s=s.replace('<link rel="stylesheet" href="css/app.css">','<link rel="stylesheet" href="css/app.css?v=2.9.19">')
          s=s.replace('<link rel="stylesheet" href="css/motion-gifs.css">','<link rel="stylesheet" href="css/motion-gifs.css?v=2.9.19">')
          s=s.replace('<script src="js/app.js"></script>\n<script src="js/motion-gifs.js"></script>','<script src="js/motion-gifs.js?v=2.9.19"></script>\n<script src="js/app.js?v=2.9.19"></script>')
          p.write_text(s,encoding='utf-8')
          PY

          node --check js/app.js
          node --check js/motion-gifs.js
          grep -q 'TrainLog Pro v2.9.19' index.html
          grep -q 'motion-gifs.js?v=2.9.19' index.html
          grep -q 'app.js?v=2.9.19' index.html

          rm -f .github/workflows/apply-v2.9.19.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/apply-v2.9.19.yml
          git commit -m 'fix: cache-bust 3D animation scripts and load helper first'
          git push
