name: Refactor Phase 4a - Training metrics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refactor-phase4a-training-metrics.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify migration before refactor
        run: node tests/core/migration-characterization.test.js
      - name: Verify storage before refactor
        run: node tests/core/storage-characterization.test.js
      - name: Verify utils before refactor
        run: node tests/core/utils-characterization.test.js
      - name: Verify training metrics before refactor
        run: node tests/training/metrics-characterization.test.js
      - name: Apply training metrics refactor
        run: python scripts/refactor_phase4a_training_metrics.py
      - name: Verify syntax after refactor
        run: |
          node --check js/training/metrics.js
          node --check js/app.js
      - name: Verify migration after refactor
        run: node tests/core/migration-characterization.test.js
      - name: Verify storage after refactor
        run: node tests/core/storage-characterization.test.js
      - name: Verify utils after refactor
        run: node tests/core/utils-characterization.test.js
      - name: Verify training metrics after refactor
        run: node tests/training/metrics-characterization.test.js
      - name: Verify integration and commit
        run: |
          grep -q 'js/training/metrics.js' index.html
          grep -q 'TrainLogTrainingMetrics' js/app.js
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js index.html js/training/metrics.js js/training/README.md docs/REFACTOR.md tests/training/metrics-characterization.test.js
          git commit -m 'refactor: extract pure training metrics'
          git push
