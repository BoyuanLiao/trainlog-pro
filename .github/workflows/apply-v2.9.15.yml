name: Apply TrainLog Pro v2.9.15

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v2.9.15.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch v2.9.15
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_v2_9_15.py
          python /tmp/patch_v2_9_15.py
          node --check js/app.js
          node --check js/motion-gifs.js
          grep -q 'TrainLog Pro v2.9.15' index.html
          grep -q 'const CURRENT_SCHEMA=18' js/app.js
          grep -q '完整還原備份' js/app.js
          grep -q 'TrainLogMotionDemoHtml(ex.pattern,ex.name)' js/app.js
          rm -f .github/workflows/apply-v2.9.15.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html js/app.js js/motion-gifs.js .github/workflows/apply-v2.9.15.yml
          git commit -m 'feat: TrainLog Pro v2.9.15 backup restore and motion demos'
          git push
