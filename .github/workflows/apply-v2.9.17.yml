name: Apply TrainLog Pro v2.9.17

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v2.9.17.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Generate 3D-style GIFs and patch app
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import math
          from PIL import Image, ImageDraw

          W,H=320,220
          BG=(16,23,29); FG=(224,235,241); FG_DARK=(150,170,180); ACC=(91,211,255); MACHINE=(90,105,115)
          out=Path('assets/motion3d'); out.mkdir(parents=True,exist_ok=True)

          def lerp(a,b,t): return a+(b-a)*t
          def cyc(i,n): return (1-math.cos(2*math.pi*i/n))/2
          def project(p,yaw=-0.15,scale=60,center=(160,140)):
              x,y,z=p; cy,sy=math.cos(yaw),math.sin(yaw); x,z=x*cy+z*sy,-x*sy+z*cy
              f=1/(1+z/4.5); scale*=0.86
              return center[0]+x*scale*f, center[1]-y*scale*f
          def limb(d,a,b,w=13,c=FG):
              ax,ay=a; bx,by=b
              d.line((ax+3,ay+4,bx+3,by+4),fill=(0,0,0),width=w+4)
              d.line((ax,ay,bx,by),fill=c,width=w)
              d.line((ax-2,ay-2,bx-2,by-2),fill=(245,250,252),width=max(2,w//4))
              r=w//2
              for x,y in (a,b): d.ellipse((x-r,y-r,x+r,y+r),fill=c,outline=(245,250,252),width=2)
          def head(d,p,r=13):
              x,y=p; d.ellipse((x-r+3,y-r+4,x+r+3,y+r+4),fill=(0,0,0)); d.ellipse((x-r,y-r,x+r,y+r),fill=FG,outline=(245,250,252),width=2); d.ellipse((x-r+4,y-r+3,x+1,y+1),fill=(245,250,252))
          def machine(d,a,b,w=7):
              d.line((*a,*b),fill=MACHINE,width=w); d.line((a[0]-1,a[1]-1,b[0]-1,b[1]-1),fill=(135,150,160),width=2)

          def render(kind,n=14):
              frames=[]
              for i in range(n):
                  t=cyc(i,n); im=Image.new('RGB',(W,H),BG); d=ImageDraw.Draw(im); d.ellipse((45,190,275,210),fill=(12,18,23)); yaw=-0.15
                  seated=kind in ('horizontal_push','horizontal_pull','vertical_push','vertical_pull','shoulder_horizontal_adduction','shoulder_extension','core_flexion','rotation','hip_abduction','hip_adduction','knee_extension')
                  if seated:
                      hip=(0,.5,0); shoulder=(0,1.55,0); headp=(0,2.05,0)
                      machine(d,project((-.7,.48,.2),yaw),project((.7,.48,.2),yaw),10); machine(d,project((-.5,.45,.25),yaw),project((-.5,1.65,.25),yaw),8)
                  else:
                      hip=(0,1,0); shoulder=(0,2,0); headp=(0,2.48,0)

                  if kind=='knee_dominant':
                      hip=(0,1.15,0); shoulder=(0,2,0); headp=(0,2.48,0); machine(d,project((-.65,.8,.2),yaw),project((-.2,2.1,.2),yaw),10); machine(d,project((2.2,.3,-.3),yaw),project((2.2,2,-.3),yaw),7)
                      knee=(lerp(.55,1.25,t),lerp(.95,1.15,t),0); ankle=(lerp(1,2,t),lerp(.5,1,t),0)
                      p={k:project(v,yaw) for k,v in {'hip':hip,'sh':shoulder,'hd':headp,'k':knee,'a':ankle}.items()}; limb(d,p['hip'],p['sh'],16); head(d,p['hd']); limb(d,p['hip'],p['k'],15); limb(d,p['k'],p['a'],14)
                  elif kind=='knee_extension':
                      knee=(.5,.55,0); ankle=(lerp(.5,1.35,t),lerp(-.25,.35,t),0); p={k:project(v,yaw) for k,v in {'hip':hip,'sh':shoulder,'hd':headp,'k':knee,'a':ankle}.items()}; limb(d,p['hip'],p['sh'],16); head(d,p['hd']); limb(d,p['hip'],p['k'],15); limb(d,p['k'],p['a'],14); x,y=p['a']; d.ellipse((x-12,y-12,x+12,y+12),fill=ACC)
                  elif kind=='knee_flexion':
                      knee=(.25,1,0); ankle=(lerp(.3,-.15,t),lerp(.15,.8,t),0); p={k:project(v,yaw) for k,v in {'hip':hip,'sh':shoulder,'hd':headp,'k':knee,'a':ankle}.items()}; limb(d,p['hip'],p['sh'],16); head(d,p['hd']); limb(d,p['hip'],p['k'],15); limb(d,p['k'],p['a'],14)
                  elif kind=='hip_extension':
                      knee=(lerp(0,-.55,t),lerp(.95,.85,t),0); ankle=(lerp(0,-1.2,t),lerp(.05,.4,t),0); p={k:project(v,yaw) for k,v in {'hip':hip,'sh':shoulder,'hd':headp,'k':knee,'a':ankle}.items()}; limb(d,p['hip'],p['sh'],16); head(d,p['hd']); limb(d,p['hip'],p['k'],15); limb(d,p['k'],p['a'],14); machine(d,project((.6,.3,.3),yaw),project((.6,1.8,.3),yaw),8)
                  elif kind in ('hip_abduction','hip_adduction'):
                      a=t if kind=='hip_abduction' else 1-t; lk=(-lerp(.35,.9,a),.15,0); rk=(lerp(.35,.9,a),.15,0); la=(-lerp(.35,.95,a),-.55,0); ra=(lerp(.35,.95,a),-.55,0)
                      p={k:project(v,0,58) for k,v in {'hip':hip,'sh':shoulder,'hd':headp,'lk':lk,'rk':rk,'la':la,'ra':ra}.items()}; limb(d,p['hip'],p['sh'],16); head(d,p['hd']); limb(d,p['hip'],p['lk'],14); limb(d,p['lk'],p['la'],13); limb(d,p['hip'],p['rk'],14); limb(d,p['rk'],p['ra'],13)
                  elif kind=='plantar_flexion':
                      dy=.18*t; hip=(0,1+dy,0); shoulder=(0,2+dy,0); headp=(0,2.48+dy,0); knee=(0,1+dy,0); ankle=(0,.2+dy,0); toe=(.25,.05,0); p={k:project(v,yaw) for k,v in {'hip':hip,'sh':shoulder,'hd':headp,'k':knee,'a':ankle,'toe':toe}.items()}; limb(d,p['hip'],p['sh'],16); head(d,p['hd']); limb(d,p['hip'],p['k'],15); limb(d,p['k'],p['a'],14); limb(d,p['a'],p['toe'],9)
                  elif kind=='cardio':
                      machine(d,(70,190),(250,190),8); hip=(0,1.2,0); shoulder=(0,2.1,0); headp=(0,2.55,0); s=math.sin(2*math.pi*i/n); lk=(.25*s,.7,0); rk=(-.25*s,.7,0); la=(.55*s,.05,0); ra=(-.55*s,.05,0); le=(-.35*s,1.6,0); re=(.35*s,1.6,0); lh=(-.5*s,1.25,0); rh=(.5*s,1.25,0); p={k:project(v,yaw,58) for k,v in {'hip':hip,'sh':shoulder,'hd':headp,'lk':lk,'rk':rk,'la':la,'ra':ra,'le':le,'re':re,'lh':lh,'rh':rh}.items()}; limb(d,p['hip'],p['sh'],16); head(d,p['hd']); limb(d,p['hip'],p['lk'],14); limb(d,p['lk'],p['la'],13); limb(d,p['hip'],p['rk'],14,FG_DARK); limb(d,p['rk'],p['ra'],13,FG_DARK); limb(d,p['sh'],p['le'],12); limb(d,p['le'],p['lh'],11); limb(d,p['sh'],p['re'],12,FG_DARK); limb(d,p['re'],p['rh'],11,FG_DARK)
                  else:
                      knee=(.55,.45,0) if seated else (0,1,0); ankle=(.65,-.45,0) if seated else (0,.15,0)
                      if kind=='core_flexion': shoulder=(.15*t,1.55-.55*t,0); headp=(.25*t,2.05-.58*t,0)
                      pih=project(hip,yaw); ps=project(shoulder,yaw); ph=project(headp,yaw); pk=project(knee,yaw); pa=project(ankle,yaw); limb(d,pih,ps,16); head(d,ph); limb(d,pih,pk,15); limb(d,pk,pa,14)
                      if kind=='horizontal_push': elbow=(lerp(.2,.75,t),1.45,.15); hand=(lerp(.35,1.45,t),1.42,-.35); elbow2=(-elbow[0],elbow[1],-.15); hand2=(-hand[0],hand[1],-.55)
                      elif kind=='horizontal_pull': elbow=(lerp(.95,.25,t),1.42,.1); hand=(lerp(1.55,.45,t),1.4,-.25); elbow2=(-elbow[0],elbow[1],-.1); hand2=(-hand[0],hand[1],-.45)
                      elif kind=='vertical_push': elbow=(.6,lerp(1.45,2,t),0); hand=(.65,lerp(1.75,2.8,t),0); elbow2=(-.6,elbow[1],.15); hand2=(-.65,hand[1],.15)
                      elif kind=='vertical_pull': elbow=(.65,lerp(2.4,1.45,t),0); hand=(.9,lerp(2.8,1.55,t),0); elbow2=(-.65,elbow[1],.15); hand2=(-.9,hand[1],.15); machine(d,project((-1.1,2.85,0),yaw),project((1.1,2.85,0),yaw),6)
                      elif kind=='shoulder_horizontal_adduction': ang=lerp(1.1,.15,t); elbow=(.75*math.sin(ang),1.55,.75*math.cos(ang)); hand=(1.1*math.sin(ang),1.55,1.1*math.cos(ang)); elbow2=(-elbow[0],elbow[1],elbow[2]); hand2=(-hand[0],hand[1],hand[2])
                      elif kind=='shoulder_extension': elbow=(.55,lerp(2.5,1.55,t),0); hand=(.65,lerp(2.9,1.15,t),0); elbow2=(-.55,elbow[1],.15); hand2=(-.65,hand[1],.15)
                      elif kind=='shoulder_abduction': elbow=(lerp(.2,1.1,t),lerp(1.75,2,t),0); hand=(lerp(.3,1.7,t),lerp(1.45,2,t),0); elbow2=(-elbow[0],elbow[1],.15); hand2=(-hand[0],hand[1],.15)
                      elif kind=='elbow_flexion': elbow=(.65,1.65,0); hand=(.65+.45*(1-t),lerp(1.1,1.85,t),0); elbow2=(-.65,1.65,.15); hand2=(-.65-.45*(1-t),hand[1],.15)
                      elif kind=='elbow_extension': elbow=(.65,1.65,0); hand=(.65,lerp(1.7,.8,t),0); elbow2=(-.65,1.65,.15); hand2=(-.65,hand[1],.15)
                      elif kind=='rotation': z=.5*(2*t-1); elbow=(.75,1.55,z); hand=(1.05,1.55,z); elbow2=(-.75,1.55,-z); hand2=(-1.05,1.55,-z)
                      else: elbow=(.55,1.45,0); hand=(.7,1.2,0); elbow2=(-.55,1.45,.15); hand2=(-.7,1.2,.15)
                      pe=project(elbow,yaw); php=project(hand,yaw); pe2=project(elbow2,yaw); php2=project(hand2,yaw); limb(d,ps,pe,12); limb(d,pe,php,11); limb(d,ps,pe2,12,FG_DARK); limb(d,pe2,php2,11,FG_DARK)
                  frames.append(im)
              frames[0].save(out/(kind+'.gif'),save_all=True,append_images=frames[1:],duration=85,loop=0,optimize=True)

          keys=['horizontal_push','horizontal_pull','vertical_push','vertical_pull','shoulder_horizontal_adduction','shoulder_extension','shoulder_abduction','elbow_flexion','elbow_extension','knee_dominant','knee_extension','knee_flexion','hip_extension','hip_abduction','hip_adduction','plantar_flexion','core_flexion','rotation','cardio']
          for k in keys: render(k)

          idxp=Path('index.html'); appp=Path('js/app.js'); motp=Path('js/motion-gifs.js')
          idx=idxp.read_text(encoding='utf-8'); app=appp.read_text(encoding='utf-8')
          idx=idx.replace('TrainLog Pro v2.9.16','TrainLog Pro v2.9.17').replace('>v2.9.16<','>v2.9.17<')

          old='''<div class="record-title">${esc(ex.name)}</div>\n   <div class="small">${esc(ex.nameEn||'')}</div>\n   <div class="tagrow" style="margin-top:8px">'''
          new='''<div class="record-title">${esc(ex.name)}</div>\n   <div class="small">${esc(ex.nameEn||'')}</div>\n   ${window.TrainLogMotion3DHtml?window.TrainLogMotion3DHtml(ex.id,ex.pattern,ex.name):''}\n   <div class="tagrow" style="margin-top:8px">'''
          if old not in app: raise SystemExit('training exercise demo insertion point not found')
          app=app.replace(old,new,1)

          wrong='''<div class="sys-en">${esc(e.nameEn)}</div>${window.TrainLogMotionDemoHtml?window.TrainLogMotionDemoHtml(e.pattern,e.nameZh):''}<div class="tagrow" style="margin-top:9px">'''
          right='''<div class="sys-en">${esc(e.nameEn)}</div><div class="tagrow" style="margin-top:9px">'''
          if wrong in app: app=app.replace(wrong,right,1)

          motion=r'''// TrainLog Pro v2.9.17 exercise 3D-style GIF demos
(function(){
'use strict';
const MAP={
 horizontal_push:'horizontal_push',horizontal_pull:'horizontal_pull',vertical_push:'vertical_push',vertical_pull:'vertical_pull',
 shoulder_horizontal_adduction:'shoulder_horizontal_adduction',shoulder_extension:'shoulder_extension',shoulder_abduction:'shoulder_abduction',
 elbow_flexion:'elbow_flexion',elbow_extension:'elbow_extension',knee_dominant:'knee_dominant',knee_extension:'knee_extension',knee_flexion:'knee_flexion',
 hip_extension:'hip_extension',hip_abduction:'hip_abduction',hip_adduction:'hip_adduction',plantar_flexion:'plantar_flexion',core_flexion:'core_flexion',rotation:'rotation',cardio:'cardio',
 multi_press:'horizontal_push',dual_pull:'horizontal_pull',scapular_control:'horizontal_pull',guided_compound:'knee_dominant',dual_leg:'knee_dominant',core_stability:'core_flexion',mobility:'core_flexion'
};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function keyFor(id,pattern,name=''){
 const s=(name||'').toLowerCase();
 if(/leg extension|腿伸|伸腿/.test(s))return 'knee_extension';
 if(/leg curl|腿彎|腿後勾/.test(s))return 'knee_flexion';
 if(/abduction|外展/.test(s))return 'hip_abduction';
 if(/adduction|內收|內展/.test(s))return 'hip_adduction';
 if(/calf|小腿/.test(s))return 'plantar_flexion';
 if(/biceps|二頭/.test(s))return 'elbow_flexion';
 if(/triceps|三頭/.test(s))return 'elbow_extension';
 if(/lateral raise|側平舉/.test(s))return 'shoulder_abduction';
 if(/pullover|擴背/.test(s))return 'shoulder_extension';
 if(/pec|fly|蝴蝶|夾胸/.test(s))return 'shoulder_horizontal_adduction';
 if(/shoulder press|肩推/.test(s))return 'vertical_push';
 if(/lat pulldown|下拉/.test(s))return 'vertical_pull';
 if(/row|划船/.test(s))return 'horizontal_pull';
 if(/chest press|胸推/.test(s))return 'horizontal_push';
 if(/leg press|hack squat|腿推|哈克/.test(s))return 'knee_dominant';
 if(/crunch|腹肌|捲腹/.test(s))return 'core_flexion';
 if(/rotation|旋轉/.test(s))return 'rotation';
 if(/treadmill|bike|elliptical|跑步|腳踏|橢圓/.test(s))return 'cardio';
 return MAP[pattern]||'horizontal_push';
}
window.TrainLogMotion3DHtml=function(id,pattern,label){
 const key=keyFor(id,pattern,label);
 return '<div class="motion-demo motion-demo-3d"><div class="motion-demo-title"><span>3D 動作動畫</span><span class="pill">GIF</span></div><img src="assets/motion3d/'+key+'.gif" alt="'+esc(label||'動作')+' 3D GIF 動作示意" loading="eager"><div class="motion-demo-note">依目前動作自動選擇對應動畫，主要用來快速確認移動方向與關節動作；實際座椅、握距、活動範圍仍以現場器材與舒適動作為準。</div></div>';
};
})();
'''
          motp.write_text(motion,encoding='utf-8')
          idxp.write_text(idx,encoding='utf-8'); appp.write_text(app,encoding='utf-8')
          PY

          node --check js/app.js
          node --check js/motion-gifs.js
          grep -q 'TrainLog Pro v2.9.17' index.html
          grep -q 'TrainLogMotion3DHtml(ex.id,ex.pattern,ex.name)' js/app.js
          if grep -q 'TrainLogMotionDemoHtml(e.pattern,e.nameZh)' js/app.js; then echo 'equipment detail still has GIF'; exit 1; fi
          test -f assets/motion3d/horizontal_push.gif
          test -f assets/motion3d/vertical_pull.gif
          test -f assets/motion3d/knee_dominant.gif

          rm -f .github/workflows/apply-v2.9.17.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html js/app.js js/motion-gifs.js assets/motion3d .github/workflows/apply-v2.9.17.yml
          git commit -m 'feat: add per-exercise 3D GIF demos to training info'
          git push
