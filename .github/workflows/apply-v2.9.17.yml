name: Apply TrainLog Pro v2.9.17

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v2.9.17.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Generate 3D-style exercise GIFs and patch app
        shell: bash
        run: |
          cat > /tmp/apply_v2917.py <<'PY'
          from pathlib import Path
          import math
          from PIL import Image, ImageDraw

          W,H=320,220
          BG=(16,23,29); FG=(224,235,241); DARK=(150,170,180); MACHINE=(90,105,115)
          OUT=Path('assets/motion3d'); OUT.mkdir(parents=True,exist_ok=True)

          def cyc(i,n): return (1-math.cos(2*math.pi*i/n))/2
          def mix(a,b,t): return a+(b-a)*t
          def proj(p,yaw=-.22,scale=52):
              x,y,z=p; c,s=math.cos(yaw),math.sin(yaw); x,z=x*c+z*s,-x*s+z*c; f=1/(1+z/4.5)
              return 160+x*scale*f,140-y*scale*f
          def limb(d,a,b,w=12,c=FG):
              d.line((a[0]+3,a[1]+4,b[0]+3,b[1]+4),fill=(0,0,0),width=w+4)
              d.line((*a,*b),fill=c,width=w); d.line((a[0]-2,a[1]-2,b[0]-2,b[1]-2),fill=(248,251,252),width=max(2,w//4))
              r=w//2
              for x,y in (a,b): d.ellipse((x-r,y-r,x+r,y+r),fill=c,outline=(248,251,252),width=2)
          def head(d,p):
              x,y=p; r=13; d.ellipse((x-r+3,y-r+4,x+r+3,y+r+4),fill=(0,0,0)); d.ellipse((x-r,y-r,x+r,y+r),fill=FG,outline=(248,251,252),width=2)
          def machine(d,a,b,w=7): d.line((*a,*b),fill=MACHINE,width=w)
          def body(d,seated=True,torso=.0):
              hip=(0,.55,0) if seated else (0,1,0); sh=(torso,1.55 if seated else 2,0); hd=(torso*1.2,2.05 if seated else 2.48,0)
              if seated:
                  machine(d,proj((-.7,.48,.25)),proj((.7,.48,.25)),10); machine(d,proj((-.5,.45,.3)),proj((-.5,1.65,.3)),8); knee=(.55,.45,0); ankle=(.65,-.42,0)
              else: knee=(0,1,0); ankle=(0,.15,0)
              p={k:proj(v) for k,v in {'hip':hip,'sh':sh,'hd':hd,'k':knee,'a':ankle}.items()}
              limb(d,p['hip'],p['sh'],16); head(d,p['hd']); limb(d,p['hip'],p['k'],14); limb(d,p['k'],p['a'],13)
              return hip,sh,p['sh']
          def upper(d,kind,t):
              seated=kind not in ('shoulder_abduction','elbow_flexion','elbow_extension')
              torso=.15*t if kind=='core_flexion' else 0
              hip,sh,ps=body(d,seated,torso)
              if kind=='horizontal_push': e=(mix(.25,.75,t),1.48,.1); h=(mix(.45,1.35,t),1.46,-.45)
              elif kind=='horizontal_pull': e=(mix(.95,.3,t),1.48,.1); h=(mix(1.5,.55,t),1.45,-.35)
              elif kind=='vertical_push': e=(.6,mix(1.45,2.0,t),0); h=(.65,mix(1.75,2.75,t),0)
              elif kind=='vertical_pull': e=(.65,mix(2.35,1.45,t),0); h=(.9,mix(2.75,1.55,t),0); machine(d,proj((-1.1,2.82,0)),proj((1.1,2.82,0)),6)
              elif kind=='shoulder_horizontal_adduction':
                  a=mix(1.15,.15,t); e=(.75*math.sin(a),1.55,.75*math.cos(a)); h=(1.1*math.sin(a),1.55,1.1*math.cos(a))
              elif kind=='shoulder_extension': e=(.55,mix(2.45,1.55,t),0); h=(.65,mix(2.85,1.15,t),0)
              elif kind=='shoulder_abduction': e=(mix(.2,1.05,t),mix(1.8,2.0,t),0); h=(mix(.3,1.65,t),mix(1.45,2.0,t),0)
              elif kind=='elbow_flexion': e=(.65,1.65,0); h=(.65+.45*(1-t),mix(1.1,1.85,t),0)
              elif kind=='elbow_extension': e=(.65,1.65,0); h=(.65,mix(1.7,.8,t),0)
              elif kind=='rotation':
                  z=.55*(2*t-1); e=(.75,1.55,z); h=(1.05,1.55,z)
              else: e=(.55,1.45,0); h=(.7,1.2,0)
              e2=(-e[0],e[1],-.15 if kind!='rotation' else -e[2]); h2=(-h[0],h[1],-.25 if kind!='rotation' else -h[2])
              pe,ph,pe2,ph2=proj(e),proj(h),proj(e2),proj(h2); limb(d,ps,pe,12); limb(d,pe,ph,11); limb(d,ps,pe2,12,DARK); limb(d,pe2,ph2,11,DARK)
          def lower(d,kind,t):
              if kind=='knee_dominant':
                  hip=(0,1.15,0); sh=(0,2,0); hd=(0,2.48,0); machine(d,proj((-.65,.8,.2)),proj((-.2,2.1,.2)),10); machine(d,proj((2.2,.3,-.3)),proj((2.2,2,-.3)),7); k=(mix(.55,1.25,t),mix(.95,1.15,t),0); a=(mix(1,2,t),mix(.5,1,t),0)
                  p={q:proj(v) for q,v in {'h':hip,'s':sh,'d':hd,'k':k,'a':a}.items()}; limb(d,p['h'],p['s'],16); head(d,p['d']); limb(d,p['h'],p['k'],14); limb(d,p['k'],p['a'],13)
              elif kind=='knee_extension':
                  hip,sh,ps=body(d,True); k=(.5,.5,0); a=(mix(.5,1.35,t),mix(-.25,.35,t),0); ph,pk,pa=proj(hip),proj(k),proj(a); limb(d,ph,pk,14); limb(d,pk,pa,13)
              elif kind=='knee_flexion':
                  hip,sh,ps=body(d,False); k=(.25,1,0); a=(mix(.3,-.15,t),mix(.15,.8,t),0); ph,pk,pa=proj(hip),proj(k),proj(a); limb(d,ph,pk,14); limb(d,pk,pa,13)
              elif kind=='hip_extension':
                  hip,sh,ps=body(d,False); k=(mix(0,-.55,t),mix(.95,.85,t),0); a=(mix(0,-1.15,t),mix(.05,.4,t),0); ph,pk,pa=proj(hip),proj(k),proj(a); limb(d,ph,pk,14); limb(d,pk,pa,13); machine(d,proj((.6,.3,.3)),proj((.6,1.8,.3)),8)
              elif kind in ('hip_abduction','hip_adduction'):
                  hip,sh,ps=body(d,True); a=t if kind=='hip_abduction' else 1-t; lk=(-mix(.35,.9,a),.1,0); rk=(mix(.35,.9,a),.1,0); la=(-mix(.35,.95,a),-.55,0); ra=(mix(.35,.95,a),-.55,0); ph=proj(hip)
                  for k1,a1,c in ((lk,la,FG),(rk,ra,DARK)): pk,pa=proj(k1),proj(a1); limb(d,ph,pk,14,c); limb(d,pk,pa,13,c)
              elif kind=='plantar_flexion':
                  body(d,False); machine(d,(110,187),(210,187),7)
              elif kind=='cardio':
                  machine(d,(70,190),(250,190),8); hip=(0,1.2,0); sh=(0,2.1,0); hd=(0,2.55,0); s=math.sin(t*2*math.pi); lk=(.25*s,.7,0); rk=(-.25*s,.7,0); la=(.55*s,.05,0); ra=(-.55*s,.05,0); p={q:proj(v) for q,v in {'h':hip,'s':sh,'d':hd,'lk':lk,'rk':rk,'la':la,'ra':ra}.items()}; limb(d,p['h'],p['s'],16); head(d,p['d']); limb(d,p['h'],p['lk'],14); limb(d,p['lk'],p['la'],13); limb(d,p['h'],p['rk'],14,DARK); limb(d,p['rk'],p['ra'],13,DARK)
          def render(kind,n=14):
              frames=[]
              lowerKinds={'knee_dominant','knee_extension','knee_flexion','hip_extension','hip_abduction','hip_adduction','plantar_flexion','cardio'}
              for i in range(n):
                  t=cyc(i,n); im=Image.new('RGB',(W,H),BG); d=ImageDraw.Draw(im); d.ellipse((45,190,275,210),fill=(12,18,23)); lower(d,kind,t) if kind in lowerKinds else upper(d,kind,t); frames.append(im)
              frames[0].save(OUT/(kind+'.gif'),save_all=True,append_images=frames[1:],duration=90,loop=0,optimize=True)
          keys=['horizontal_push','horizontal_pull','vertical_push','vertical_pull','shoulder_horizontal_adduction','shoulder_extension','shoulder_abduction','elbow_flexion','elbow_extension','knee_dominant','knee_extension','knee_flexion','hip_extension','hip_abduction','hip_adduction','plantar_flexion','core_flexion','rotation','cardio']
          for k in keys: render(k)

          idxp=Path('index.html'); appp=Path('js/app.js'); motp=Path('js/motion-gifs.js')
          idx=idxp.read_text(encoding='utf-8'); app=appp.read_text(encoding='utf-8')
          idx=idx.replace('TrainLog Pro v2.9.16','TrainLog Pro v2.9.17').replace('>v2.9.16<','>v2.9.17<')
          old='<div class="record-title">${esc(ex.name)}</div>\n   <div class="small">${esc(ex.nameEn||\'\')}</div>\n   <div class="tagrow" style="margin-top:8px">'
          new='<div class="record-title">${esc(ex.name)}</div>\n   <div class="small">${esc(ex.nameEn||\'\')}</div>\n   ${window.TrainLogMotion3DHtml?window.TrainLogMotion3DHtml(ex.id,ex.pattern,ex.name):\'\'}\n   <div class="tagrow" style="margin-top:8px">'
          if old not in app: raise SystemExit('training info insertion point not found')
          app=app.replace(old,new,1)
          wrong='<div class="sys-en">${esc(e.nameEn)}</div>${window.TrainLogMotionDemoHtml?window.TrainLogMotionDemoHtml(e.pattern,e.nameZh):\'\'}<div class="tagrow" style="margin-top:9px">'
          right='<div class="sys-en">${esc(e.nameEn)}</div><div class="tagrow" style="margin-top:9px">'
          app=app.replace(wrong,right,1)
          motion="""// TrainLog Pro v2.9.17 exercise 3D-style GIF demos
          (function(){
          'use strict';
          const MAP={horizontal_push:'horizontal_push',horizontal_pull:'horizontal_pull',vertical_push:'vertical_push',vertical_pull:'vertical_pull',shoulder_horizontal_adduction:'shoulder_horizontal_adduction',shoulder_extension:'shoulder_extension',shoulder_abduction:'shoulder_abduction',elbow_flexion:'elbow_flexion',elbow_extension:'elbow_extension',knee_dominant:'knee_dominant',knee_extension:'knee_extension',knee_flexion:'knee_flexion',hip_extension:'hip_extension',hip_abduction:'hip_abduction',hip_adduction:'hip_adduction',plantar_flexion:'plantar_flexion',core_flexion:'core_flexion',rotation:'rotation',cardio:'cardio',multi_press:'horizontal_push',dual_pull:'horizontal_pull',scapular_control:'horizontal_pull',guided_compound:'knee_dominant',dual_leg:'knee_dominant',core_stability:'core_flexion',mobility:'core_flexion'};
          function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]))}
          function key(pattern,name=''){const s=name.toLowerCase();if(/leg extension|腿伸|伸腿/.test(s))return'knee_extension';if(/leg curl|腿彎|腿後勾/.test(s))return'knee_flexion';if(/abduction|外展/.test(s))return'hip_abduction';if(/adduction|內收|內展/.test(s))return'hip_adduction';if(/calf|小腿/.test(s))return'plantar_flexion';if(/biceps|二頭/.test(s))return'elbow_flexion';if(/triceps|三頭/.test(s))return'elbow_extension';if(/lateral raise|側平舉/.test(s))return'shoulder_abduction';if(/pullover|擴背/.test(s))return'shoulder_extension';if(/pec|fly|蝴蝶|夾胸/.test(s))return'shoulder_horizontal_adduction';if(/shoulder press|肩推/.test(s))return'vertical_push';if(/lat pulldown|下拉/.test(s))return'vertical_pull';if(/row|划船/.test(s))return'horizontal_pull';if(/chest press|胸推/.test(s))return'horizontal_push';if(/leg press|hack squat|腿推|哈克/.test(s))return'knee_dominant';if(/crunch|腹肌|捲腹/.test(s))return'core_flexion';if(/rotation|旋轉/.test(s))return'rotation';if(/treadmill|bike|elliptical|跑步|腳踏|橢圓/.test(s))return'cardio';return MAP[pattern]||'horizontal_push'}
          window.TrainLogMotion3DHtml=function(id,pattern,label){const k=key(pattern,label||'');return '<div class=\"motion-demo motion-demo-3d\"><div class=\"motion-demo-title\"><span>3D 動作動畫</span><span class=\"pill\">GIF</span></div><img src=\"assets/motion3d/'+k+'.gif\" alt=\"'+esc(label||'動作')+' 3D GIF 動作示意\" loading=\"eager\"><div class=\"motion-demo-note\">依目前動作自動選擇對應動畫，用來快速確認移動方向與關節動作；實際座椅、握距與活動範圍仍以現場器材為準。</div></div>'};
          })();
          """
          import textwrap
          motp.write_text(textwrap.dedent(motion),encoding='utf-8'); idxp.write_text(idx,encoding='utf-8'); appp.write_text(app,encoding='utf-8')
          PY
          python /tmp/apply_v2917.py
          node --check js/app.js
          node --check js/motion-gifs.js
          grep -q 'TrainLog Pro v2.9.17' index.html
          grep -q 'TrainLogMotion3DHtml(ex.id,ex.pattern,ex.name)' js/app.js
          if grep -q 'TrainLogMotionDemoHtml(e.pattern,e.nameZh)' js/app.js; then echo 'equipment detail still has old GIF'; exit 1; fi
          test -f assets/motion3d/horizontal_push.gif
          test -f assets/motion3d/vertical_pull.gif
          test -f assets/motion3d/knee_dominant.gif
          rm -f .github/workflows/apply-v2.9.17.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html js/app.js js/motion-gifs.js assets/motion3d .github/workflows/apply-v2.9.17.yml
          git commit -m 'feat: show per-exercise 3D GIF in training info modal'
          git push
