name: Refactor Phase 4e - Progression UI explainability

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refactor-phase4e-progression-ui.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify core migration before refactor
        run: node tests/core/migration-characterization.test.js
      - name: Verify core storage before refactor
        run: node tests/core/storage-characterization.test.js
      - name: Verify core utils before refactor
        run: node tests/core/utils-characterization.test.js
      - name: Verify training metrics before refactor
        run: node tests/training/metrics-characterization.test.js
      - name: Verify lifecycle before refactor
        run: node tests/training/lifecycle-characterization.test.js
      - name: Verify mutations before refactor
        run: node tests/training/mutations-characterization.test.js
      - name: Verify progression engine before refactor
        run: |
          node tests/training/progression-characterization.test.js
          node tests/training/progression-engine.test.js
      - name: Verify progression UI formatter before wiring
        run: node tests/training/progression-ui.test.js
      - name: Apply progression UI refactor
        run: python scripts/refactor_phase4e_progression_ui.py
      - name: Verify syntax after refactor
        run: |
          node --check js/training/progression-view.js
          node --check js/training/progression.js
          node --check js/app.js
      - name: Verify core regression after refactor
        run: |
          node tests/core/migration-characterization.test.js
          node tests/core/storage-characterization.test.js
          node tests/core/utils-characterization.test.js
      - name: Verify training regression after refactor
        run: |
          node tests/training/metrics-characterization.test.js
          node tests/training/lifecycle-characterization.test.js
          node tests/training/mutations-characterization.test.js
          node tests/training/progression-characterization.test.js
          node tests/training/progression-engine.test.js
          node tests/training/progression-ui.test.js
      - name: Verify integration and commit
        run: |
          grep -q 'js/training/progression-view.js' index.html
          grep -q 'TrainLogProgressionView' js/app.js
          grep -q 'progressionDisplay' js/app.js
          grep -q 'view.evidence' js/app.js
          grep -q '可能平台期' js/training/progression-view.js
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js index.html js/training/progression-view.js js/training/README.md docs/REFACTOR.md tests/training/progression-ui.test.js scripts/refactor_phase4e_progression_ui.py
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'feat: explain progression recommendations in UI'
            git push
          fi
