name: Refactor Phase 3a - Migration core

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refactor-phase3a-migration.yml'
      - 'scripts/refactor_phase3a_migration.py'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify characterization before refactor
        run: node tests/core/migration-characterization.test.js

      - name: Apply migration-core refactor
        run: python scripts/refactor_phase3a_migration.py

      - name: Verify syntax after refactor
        run: |
          node --check js/core/migration.js
          node --check js/app.js
          node --check tests/core/migration-characterization.test.js

      - name: Verify characterization after refactor
        run: node tests/core/migration-characterization.test.js

      - name: Verify integration and commit
        run: |
          git diff --check
          grep -q 'js/core/migration.js' index.html
          grep -q 'TrainLogMigration.create' js/app.js
          grep -q 'migrationCore.migrate' js/app.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/core/migration.js js/core/README.md js/app.js index.html tests/core/migration-characterization.test.js
          git commit -m 'refactor: extract schema migration core'
          git push
