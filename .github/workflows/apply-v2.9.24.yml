name: Apply TrainLog Pro v2.9.24

on:
  push:
    paths:
      - '.github/workflows/apply-v2.9.24.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch v2.9.24
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('js/app.js')
          s = app.read_text(encoding='utf-8')
          old = "${window.TrainLogMotion3DHtml?window.TrainLogMotion3DHtml(ex.id,ex.pattern,ex.name):''}"
          new = "${window.TrainLogMotion3DHtml?window.TrainLogMotion3DHtml(ex.id,ex.pattern,ex.name,ex.nameEn||'',eq?.nameEn||''):''}"
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one training demo call, found {count}')
          app.write_text(s.replace(old, new), encoding='utf-8')

          index = Path('index.html')
          h = index.read_text(encoding='utf-8')
          if 'v2.9.23' not in h:
              raise SystemExit('v2.9.23 marker not found in index.html')
          index.write_text(h.replace('v2.9.23','v2.9.24').replace('v=2.9.23','v=2.9.24'), encoding='utf-8')
          PY

          node --check js/app.js
          node --check js/motion-gifs.js
          grep -F "TrainLogMotion3DHtml(ex.id,ex.pattern,ex.name,ex.nameEn||'',eq?.nameEn||'')" js/app.js
          grep -F "TrainLog Pro v2.9.24" index.html
          grep -F "v2.9.24" js/motion-gifs.js

      - name: Commit changes
        shell: bash
        run: |
          rm -f .github/workflows/apply-v2.9.24.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js index.html .github/workflows/apply-v2.9.24.yml
          git commit -m 'feat: TrainLog Pro v2.9.24 safer exercise demo matching'
          git push origin HEAD:main
