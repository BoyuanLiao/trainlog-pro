name: Fix startup cache compatibility

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_startup_cache_compat.py'
      - '.github/workflows/fix-startup-cache-compat.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply compatibility fix
        run: python3 scripts/fix_startup_cache_compat.py
      - name: Verify JavaScript syntax
        run: |
          node --check js/app.js
          node --check js/training/progression-actions.js
      - name: Verify UI regressions
        run: |
          node tests/ui/records-page-regression.test.js
          node tests/ui/startup-cache-compat.test.js
      - name: Verify core regressions
        run: |
          node tests/core/migration-characterization.test.js
          node tests/core/storage-characterization.test.js
          node tests/core/utils-characterization.test.js
      - name: Verify training regressions
        run: |
          node tests/training/metrics-characterization.test.js
          node tests/training/lifecycle-characterization.test.js
          node tests/training/mutations-characterization.test.js
          node tests/training/progression-engine.test.js
          node tests/training/progression-ui.test.js
          node tests/training/progression-actions.test.js
      - name: Verify integration and commit
        run: |
          grep -q "TrainLog Pro v2.10.2" index.html
          grep -q "js/app.js?v=2.10.2" index.html
          grep -q "id=\"manualFromRecords\" hidden" index.html
          ! grep -q '<button[^>]*id="manualFromRecords"' index.html
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html js/app.js sw.js tests/ui/records-page-regression.test.js
          git commit -m "fix: prevent stale asset startup failure"
          git push
