name: Migrate TrainLog to source project

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-to-source.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild and split TrainLog source
        shell: python
        run: |
          from pathlib import Path
          import base64, gzip, re, shutil

          root = Path('.')
          chunks = sorted((root / 'gz').glob('*.txt'))
          if not chunks:
              raise SystemExit('No gz chunks found')

          payload = ''.join(p.read_text(encoding='utf-8').strip() for p in chunks)
          html = gzip.decompress(base64.b64decode(payload)).decode('utf-8')

          style = re.search(r'<style>(.*?)</style>', html, re.S)
          script = re.search(r'<script>(.*?)</script>', html, re.S)
          if not style or not script:
              raise SystemExit('Could not find embedded style/script blocks')

          css = style.group(1).strip() + '\n'
          js = script.group(1).strip() + '\n'

          index = html
          index = index[:style.start()] + '<link rel="stylesheet" href="css/app.css">' + index[style.end():]
          script2 = re.search(r'<script>(.*?)</script>', index, re.S)
          index = index[:script2.start()] + '<script src="js/app.js"></script>' + index[script2.end():]
          index = index.replace('<head>', '<head>\n<!-- TrainLog Pro source project -->', 1)

          (root / 'css').mkdir(exist_ok=True)
          (root / 'js').mkdir(exist_ok=True)
          (root / 'css' / 'app.css').write_text(css, encoding='utf-8')
          (root / 'js' / 'app.js').write_text(js, encoding='utf-8')
          (root / 'index.html').write_text(index, encoding='utf-8')
          (root / '.nojekyll').write_text('', encoding='utf-8')

          shutil.rmtree(root / 'gz')

          (root / 'README.md').write_text('''# TrainLog Pro\n\nGitHub Pages 直接部署的正式原始碼專案。\n\n## 專案結構\n\n- `index.html`：頁面 HTML\n- `css/app.css`：介面樣式\n- `js/app.js`：功能與資料邏輯\n- `.nojekyll`：停用 Jekyll 處理\n\n## 開發方式\n\n之後直接修改 HTML / CSS / JS 原始碼即可，不再使用 `gz/*.txt` 壓縮分段。GitHub Pages 從 `main` 分支根目錄直接部署。\n\n## 資料\n\n訓練資料仍主要儲存在瀏覽器 LocalStorage。不同裝置或瀏覽器不會自動同步，請定期使用 App 內 JSON 備份。\n''', encoding='utf-8')

      - name: Validate JavaScript
        run: node --check js/app.js

      - name: Commit source project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Migrate TrainLog Pro to HTML CSS JS source project" || exit 0
          git push
