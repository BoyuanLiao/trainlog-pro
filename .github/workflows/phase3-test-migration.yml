name: Phase 3 - Migration characterization tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase3-test-migration.yml'
      - 'tests/core/migration-characterization.test.js'
      - 'js/app.js'
      - 'js/data/exercises.js'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run migration characterization tests
        run: node tests/core/migration-characterization.test.js
