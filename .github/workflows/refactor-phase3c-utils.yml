name: Refactor Phase 3c - Core utils

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refactor-phase3c-utils.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify migration before refactor
        run: node tests/core/migration-characterization.test.js
      - name: Verify storage before refactor
        run: node tests/core/storage-characterization.test.js
      - name: Verify utils before refactor
        run: node tests/core/utils-characterization.test.js
      - name: Apply utils refactor
        run: python scripts/refactor_phase3c_utils.py
      - name: Verify syntax after refactor
        run: |
          node --check js/core/utils.js
          node --check js/core/migration.js
          node --check js/core/storage.js
          node --check js/app.js
      - name: Verify migration after refactor
        run: node tests/core/migration-characterization.test.js
      - name: Verify storage after refactor
        run: node tests/core/storage-characterization.test.js
      - name: Verify utils after refactor
        run: node tests/core/utils-characterization.test.js
      - name: Verify integration and commit
        run: |
          grep -q 'js/core/utils.js' index.html
          grep -q 'TrainLogUtils' js/app.js
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/core/utils.js js/app.js index.html tests/core/utils-characterization.test.js js/core/README.md docs/REFACTOR.md
          git commit -m 'refactor: extract shared core utilities'
          git push
