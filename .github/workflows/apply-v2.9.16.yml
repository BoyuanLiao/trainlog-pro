name: Apply TrainLog Pro v2.9.16

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v2.9.16.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch v2.9.16
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          idxp=Path('index.html')
          appp=Path('js/app.js')
          motp=Path('js/motion-gifs.js')

          idx=idxp.read_text(encoding='utf-8')
          app=appp.read_text(encoding='utf-8')
          mot=motp.read_text(encoding='utf-8')

          idx=idx.replace('TrainLog Pro v2.9.15','TrainLog Pro v2.9.16').replace('>v2.9.15<','>v2.9.16<')

          needle='<div class="card bilingual"><div class="sys-en">${esc(e.nameEn)}</div><div class="tagrow" style="margin-top:9px">'
          repl='<div class="card bilingual"><div class="sys-en">${esc(e.nameEn)}</div>${window.TrainLogMotionDemoHtml?window.TrainLogMotionDemoHtml(e.pattern,e.nameZh):\'\'}<div class="tagrow" style="margin-top:9px">'
          if needle not in app:
              raise SystemExit('equipment detail insertion point not found')
          app=app.replace(needle,repl,1)

          cut=mot.find('\nfunction kind')
          if cut<0:
              raise SystemExit('motion helper tail not found')
          prefix=mot[:cut]
          tail=r'''
function escHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function kind(p=''){
 const map={horizontal_push:'push',vertical_push:'push',multi_press:'push',shoulder_horizontal_adduction:'push',horizontal_pull:'pull',vertical_pull:'pull',dual_pull:'pull',shoulder_extension:'pull',scapular_control:'pull',knee_dominant:'legs',knee_extension:'legs',knee_flexion:'legs',hip_extension:'legs',hip_abduction:'legs',hip_adduction:'legs',plantar_flexion:'legs',dual_leg:'legs',guided_compound:'legs',core_flexion:'core',core_stability:'core',rotation:'core',mobility:'core',cardio:'core',elbow_flexion:'pull',elbow_extension:'push'};
 return map[p]||(/pull|row/.test(p)?'pull':/knee|hip|calf|leg/.test(p)?'legs':/core|rotation|mobility|cardio/.test(p)?'core':'push')
}
window.TrainLogMotionDemoHtml=function(pattern,label){
 const src=G[kind(pattern)]||G.push;
 return '<div class="motion-demo"><div class="motion-demo-title"><span>簡易動作示意</span><span class="pill">GIF</span></div><img src="data:image/gif;base64,'+src+'" alt="'+escHtml(label||'器材')+' 簡易動作 GIF 示意"><div class="motion-demo-note">用來快速理解此器材的主要移動方向；實際座椅高度、起始位置、活動範圍與機械軌跡請依現場器材調整。</div></div>';
};
})();
'''
          mot=prefix+tail

          idxp.write_text(idx,encoding='utf-8')
          appp.write_text(app,encoding='utf-8')
          motp.write_text(mot,encoding='utf-8')
          PY

          node --check js/app.js
          node --check js/motion-gifs.js
          grep -q 'TrainLog Pro v2.9.16' index.html
          grep -q 'TrainLogMotionDemoHtml(e.pattern,e.nameZh)' js/app.js
          if grep -q 'MutationObserver' js/motion-gifs.js; then echo 'unexpected modal auto injection remains'; exit 1; fi

          rm -f .github/workflows/apply-v2.9.16.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html js/app.js js/motion-gifs.js .github/workflows/apply-v2.9.16.yml
          git commit -m 'fix: show motion GIF only in equipment detail dialogs'
          git push
