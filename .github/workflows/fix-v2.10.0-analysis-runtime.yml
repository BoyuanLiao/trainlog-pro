name: Fix TrainLog Pro v2.10.0 analysis runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-v2.10.0-analysis-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix range integration, weekly sets, PR types, and cache keys
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('js/app.js')
          s=p.read_text(encoding='utf-8')
          old=" const __v210days=data.settings.analysisRange||30;renderV210Analysis(workoutsInRange(__v210days),__v210days);bindAnalysisTabs();"
          new=" const __v210days=analysisRange==='all'?'all':n(analysisRange);renderV210Analysis(selectedAnalysisWorkouts(),__v210days);bindAnalysisTabs();"
          if s.count(old)!=1:
              raise SystemExit(f'Expected one v2.10 range integration line, found {s.count(old)}')
          s=s.replace(old,new,1)
          if s.count('row.sets+=formalSetCount(w);')!=1:
              raise SystemExit('Expected one per-workout formalSetCount call')
          s=s.replace('row.sets+=formalSetCount(w);','row.sets+=effectiveSets(w);',1)

          old_pr="""    let bestWeight=0,bestE1rm=0,bestVolume=0,started=false;
              sessions.forEach(s=>{
                const oldW=bestWeight,oldE=bestE1rm,oldV=bestVolume;
                const w=n(s.maxWeight),e=n(s.bestE1rm),v=n(s.volume);
                let event=null;
                if(started&&periodDates.has(s.date)){
                  if(w>oldW+.0001)event={kind:'重量 PR',value:fmtWeight(w)};
                  else if(e>0&&oldE>0&&e>oldE*1.01)event={kind:'估算力量 PR',value:`e1RM ${fmtWeight(e)}`};
                  else if(v>0&&oldV>0&&v>oldV*1.05)event={kind:'單次完成量 PR',value:fmtKg(v)};
                }
                bestWeight=Math.max(bestWeight,w);bestE1rm=Math.max(bestE1rm,e);bestVolume=Math.max(bestVolume,v);
                if(w>0||e>0||v>0)started=true;
                if(event)events.push({date:s.date,name:ex.name,...event})
              })"""
          new_pr="""    let bestWeight=0,bestE1rm=0,bestVolume=0,bestSeconds=0,bestDistance=0,started=false;
              sessions.forEach(s=>{
                const oldW=bestWeight,oldE=bestE1rm,oldV=bestVolume,oldSeconds=bestSeconds,oldDistance=bestDistance;
                const w=n(s.maxWeight),e=n(s.bestE1rm),v=n(s.volume),seconds=n(s.bestSeconds),distance=n(s.distance);
                let event=null;
                if(started&&periodDates.has(s.date)){
                  if(s.type==='duration'&&seconds>oldSeconds)event={kind:'時間 PR',value:`${Math.round(seconds)} 秒`};
                  else if(s.type==='cardio'&&distance>0&&oldDistance>0&&distance>oldDistance*1.01)event={kind:'距離 PR',value:`${distance.toFixed(2).replace(/\\.00$/,'')} km`};
                  else if(!['duration','cardio'].includes(s.type)&&w>oldW+.0001)event={kind:'重量 PR',value:fmtWeight(w)};
                  else if(!['duration','cardio'].includes(s.type)&&e>0&&oldE>0&&e>oldE*1.01)event={kind:'估算力量 PR',value:`e1RM ${fmtWeight(e)}`};
                  else if(!['duration','cardio'].includes(s.type)&&v>0&&oldV>0&&v>oldV*1.05)event={kind:'單次完成量 PR',value:fmtKg(v)};
                }
                bestWeight=Math.max(bestWeight,w);bestE1rm=Math.max(bestE1rm,e);bestVolume=Math.max(bestVolume,v);bestSeconds=Math.max(bestSeconds,seconds);bestDistance=Math.max(bestDistance,distance);
                if(w>0||e>0||v>0||seconds>0||distance>0)started=true;
                if(event)events.push({date:s.date,name:ex.name,...event})
              })"""
          if s.count(old_pr)!=1:
              raise SystemExit(f'Expected one PR block, found {s.count(old_pr)}')
          s=s.replace(old_pr,new_pr,1)
          p.write_text(s,encoding='utf-8')

          p=Path('index.html')
          h=p.read_text(encoding='utf-8')
          h=h.replace('?v=2.9.24','?v=2.10.0')
          p.write_text(h,encoding='utf-8')
          PY
          node --check js/app.js
          grep -F "selectedAnalysisWorkouts(),__v210days" js/app.js
          grep -F "row.sets+=effectiveSets(w)" js/app.js
          grep -F "s.type==='duration'" js/app.js
          grep -F '?v=2.10.0' index.html

      - name: Commit runtime fixes
        shell: bash
        run: |
          rm -f .github/workflows/fix-v2.10.0-analysis-runtime.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js index.html .github/workflows/fix-v2.10.0-analysis-runtime.yml
          git commit -m 'fix: v2.10.0 analysis runtime and cache integration'
          git push origin HEAD:main
