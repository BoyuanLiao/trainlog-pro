name: Fix v2.9.24 motion context

on:
  push:
    paths:
      - '.github/workflows/fix-v2.9.24-motion-context.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep movement identity separate from combo equipment names
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('js/motion-gifs.js')
          s=p.read_text(encoding='utf-8')
          old="""function makeQueryInfo(nameEn,label,equipmentName){
            const query=englishHint(nameEn,label);
            const semanticText=norm([query,nameEn,label,equipmentName].filter(Boolean).join(' '));
            return {
              query,
              semanticText,
              requiredFamily:explicitRequestedFamily(nameEn,label,equipmentName),
              queryConcepts:concepts(semanticText),
              primaryConcept:strongConcept(semanticText)
            };
          }"""
          new="""function makeQueryInfo(nameEn,label,equipmentName){
            const query=englishHint(nameEn,label);
            // Movement identity comes from the exercise itself. A combo machine name such as
            // \"Inner / Outer Thigh Machine\" must not overwrite an exercise like Hip Adduction.
            const actionText=norm([query,nameEn,label].filter(Boolean).join(' '));
            const semanticText=norm([actionText,equipmentName].filter(Boolean).join(' '));
            return {
              query,
              semanticText,
              requiredFamily:explicitRequestedFamily(nameEn,label,equipmentName),
              queryConcepts:concepts(actionText),
              primaryConcept:strongConcept(actionText)
            };
          }"""
          if s.count(old)!=1:
              raise SystemExit(f'Expected one matcher context block, found {s.count(old)}')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          node --check js/motion-gifs.js
          grep -F 'const actionText=' js/motion-gifs.js
      - name: Commit
        shell: bash
        run: |
          rm -f .github/workflows/fix-v2.9.24-motion-context.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/motion-gifs.js .github/workflows/fix-v2.9.24-motion-context.yml
          git commit -m 'fix: keep exercise identity separate from combo equipment context'
          git push origin HEAD:main
